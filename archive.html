<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARCHIVE // 2+5 VOL. 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #b5b5b5;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      user-select: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 50px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.6) 50%);
      background-size: 100% 3px;
      z-index: 40;
      pointer-events: none;
      opacity: 0.55;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, #000000 95%);
      z-index: 41;
      pointer-events: none;
    }

    /* Наблюдающие глаза */
    .eyes-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .eye-pair {
      position: absolute;
      display: flex;
      gap: 14px;
      opacity: 0.35;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
    }

    .peeping-eye {
      width: 14px;
      height: 7px;
      background: #111;
      border-radius: 50%;
      border-top: 1px solid #777;
      border-bottom: 1px solid #444;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .peeping-eye::after {
      content: "";
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 5px #ffffff;
    }

    .pair-1 { top: 12%; left: 8%; animation: slowBlink 6.5s infinite; }
    .pair-2 { top: 28%; right: 10%; animation: slowBlink 8.2s infinite 1.8s; }
    .pair-3 { top: 62%; left: 6%; animation: slowBlink 7.1s infinite 3.2s; }
    .pair-4 { top: 78%; right: 9%; animation: slowBlink 9s infinite 0.7s; }

    @keyframes slowBlink {
      0%, 94%, 100% { transform: scaleY(1); opacity: 0.35; }
      96% { transform: scaleY(0.05); opacity: 0.05; }
      98% { transform: scaleY(1); opacity: 0.35; }
    }

    .content-box {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .top-warning {
      font-size: 10px;
      letter-spacing: 3px;
      color: #631219;
      text-transform: uppercase;
      text-align: center;
    }

    .cover-frame {
      position: relative;
      width: 82%;
      max-width: 300px;
      aspect-ratio: 3 / 4;
      background: #08080a;
      border: 1px solid #292930;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 15px rgba(90, 15, 22, 0.3);
      overflow: hidden;
    }

    .cover-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(110%) brightness(95%);
    }

    .cover-overlay-tag {
      position: absolute;
      bottom: 8px;
      right: 8px;
      font-size: 8px;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 6px;
      color: #70131b;
      border: 1px solid #330b0e;
    }

    /* Уничтоженный треклист */
    .tracklist-corrupted {
      width: 100%;
      background: rgba(6, 6, 8, 0.85);
      border: 1px solid #1c1c22;
      border-left: 2px solid #5a1117;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tracklist-header {
      font-size: 10px;
      letter-spacing: 2.5px;
      color: #55535c;
      text-transform: uppercase;
      border-bottom: 1px solid #141418;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .track-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #404047;
      position: relative;
    }

    .censored-bar {
      display: inline-block;
      height: 10px;
      background: #141417;
      border-radius: 1px;
      position: relative;
      overflow: hidden;
    }

    .censored-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(90, 17, 23, 0.6), transparent);
      animation: sweepCorrupt 3s infinite;
    }

    @keyframes sweepCorrupt {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .t1 { width: 140px; }
    .t2 { width: 110px; }
    .t3 { width: 165px; }
    .t4 { width: 95px; }
    .t5 { width: 130px; }

    .redacted-tag {
      font-size: 9px;
      color: #78151f;
      letter-spacing: 1px;
    }

    /* ЗАЗЫВАЮЩАЯ НЕОНОВАЯ КНОПКА «ПОСЛУШАТЬ?» */
    .listen-bait-wrap {
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      margin: 8px 0;
    }

    .listen-btn {
      width: 100%;
      background: #140103;
      border: 2px solid #ff1a2b;
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      outline: none;
      touch-action: manipulation;
      border-radius: 3px;
      /* Навязчивый пульсирующий неон и призыв к клику */
      box-shadow: 
        0 0 20px rgba(255, 26, 43, 0.7),
        inset 0 0 15px rgba(255, 26, 43, 0.4);
      animation: lurePulse 1.8s infinite ease-in-out;
    }

    @keyframes lurePulse {
      0%, 100% {
        transform: scale(1);
        border-color: #ff1a2b;
        box-shadow: 0 0 20px rgba(255, 26, 43, 0.7), inset 0 0 15px rgba(255, 26, 43, 0.4);
        color: #ffffff;
      }
      50% {
        transform: scale(1.04);
        border-color: #ff5967;
        box-shadow: 0 0 35px rgba(255, 26, 43, 1), inset 0 0 25px rgba(255, 26, 43, 0.7);
        color: #fff2f3;
        text-shadow: 0 0 8px #ffffff;
      }
    }

    .btn-cross {
      font-size: 16px;
      color: #ff1a2b;
      animation: crossSpin 3.6s infinite linear;
    }

    @keyframes crossSpin {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }

    /* Блок Coming Soon */
    .footer-promo {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .coming-soon {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(26px, 8vw, 36px);
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 
        -4px 0 8px rgba(255, 255, 255, 0.4),
         4px 0 8px rgba(255, 255, 255, 0.4),
         0 0 16px rgba(180, 20, 30, 0.6);
      animation: subtlePulse 4s infinite ease-in-out;
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.99); }
    }

    .hashtags {
      font-size: 11px;
      letter-spacing: 3px;
      color: #63616e;
      font-weight: 500;
    }

    /* СКРИМЕР: ВЫБЕГАЮЩИЙ СЛЕДОВАТЕЛЬ И ЛЕТЯЩАЯ ПУЛЯ */
    .screamer-stage {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 800px;
    }

    .screamer-active .screamer-stage {
      display: flex;
    }

    /* 1. ЛЕТЯЩАЯ В ЭКРАН ПУЛЯ */
    .bullet-projectile {
      position: absolute;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle, #fff 20%, #ff8800 60%, #ff0000 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px #ff5500, 0 0 50px #ff0000;
      opacity: 0;
      z-index: 110;
    }

    .screamer-active .bullet-projectile {
      animation: bulletFly 1.25s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }

    @keyframes bulletFly {
      0% {
        transform: scale(0.2) translateZ(-600px);
        opacity: 0;
      }
      20% {
        opacity: 1;
        transform: scale(1.5) translateZ(-200px);
      }
      70% {
        transform: scale(12) translateZ(200px);
        opacity: 1;
      }
      90% {
        transform: scale(38) translateZ(500px);
        opacity: 1;
        filter: blur(4px);
      }
      100% {
        transform: scale(70) translateZ(700px);
        opacity: 0;
        filter: blur(12px);
      }
    }

    /* 2. НАБЕГАЮЩИЙ СЛЕДОВАТЕЛЬ TONETT */
    .rusher-entity {
      position: absolute;
      width: 280px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.1) translateZ(-500px);
      opacity: 0;
      filter: contrast(180%) brightness(120%);
      z-index: 105;
    }

    .screamer-active .rusher-entity {
      animation: chargeForward 1.35s cubic-bezier(0.85, 0, 0.15, 1) forwards;
    }

    @keyframes chargeForward {
      0% {
        transform: scale(0.15) translateY(120px) translateZ(-400px);
        opacity: 0;
        filter: blur(8px) contrast(200%);
      }
      25% {
        opacity: 0.85;
      }
      60% {
        transform: scale(1.1) translateY(20px) translateZ(0);
        opacity: 1;
        filter: blur(1px) contrast(170%);
      }
      85% {
        transform: scale(3.2) translateY(-40px) translateZ(200px);
        opacity: 1;
        filter: blur(4px) contrast(220%);
      }
      100% {
        transform: scale(6.5) translateY(-80px) translateZ(400px);
        opacity: 0;
        filter: blur(15px);
      }
    }

    .rusher-head {
      width: 95px;
      height: 120px;
      background: #73594d;
      border-radius: 16px 16px 30px 30px;
      position: relative;
      box-shadow: inset 0 -20px 25px #150f0c, inset 0 10px 20px rgba(0,0,0,0.8);
      z-index: 3;
    }

    .rusher-head::before {
      content: "";
      position: absolute;
      top: -8px;
      left: -6px;
      right: -6px;
      height: 48px;
      background: #110d0b;
      border-radius: 14px 14px 4px 4px;
    }

    .rusher-eyes {
      position: absolute;
      top: 48px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
    }

    .r-eye {
      width: 15px;
      height: 10px;
      background: #000;
      position: relative;
    }

    .r-eye::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: #ff001e;
      top: 2px;
      left: 5px;
      box-shadow: 0 0 10px #ff001e;
    }

    .rusher-mouth {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 26px;
      background: #140305;
      border-radius: 4px 4px 14px 14px;
      border: 2px solid #570a10;
      box-shadow: inset 0 0 8px #000;
    }

    .rusher-body {
      width: 220px;
      height: 180px;
      background: #1c1f24;
      margin-top: -6px;
      border-radius: 26px 26px 0 0;
      position: relative;
      box-shadow: inset 0 30px 35px #070809;
      z-index: 2;
    }

    /* Слом экрана */
    .screamer-active {
      animation: violentCrack 1.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    @keyframes violentCrack {
      0% { transform: translate(0, 0) scale(1); filter: invert(0); }
      15% { transform: translate(-10px, 8px) scale(1.03); filter: invert(0.9) contrast(200%); }
      30% { transform: translate(12px, -10px) scale(0.98); filter: invert(0); }
      45% { transform: translate(-15px, -12px) scale(1.05); filter: invert(1) hue-rotate(180deg); }
      60% { transform: translate(14px, 15px) scale(1.02); filter: invert(0.3); }
      75% { transform: translate(-16px, 12px) scale(1.08); filter: invert(1); }
      90% { transform: translate(10px, -8px) scale(1.04); filter: invert(0); }
      100% { transform: translate(0, 0) scale(1); filter: invert(0); }
    }

    /* ФИНАЛЬНЫЙ ЧЕРНЫЙ ЭКРАН С "tonett." */
    .void-blackout {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .void-active {
      opacity: 1;
      pointer-events: auto;
    }

    .tonett-mark {
      font-family: 'Space Mono', monospace;
      font-size: clamp(34px, 10vw, 54px);
      letter-spacing: 6px;
      color: #940f19;
      text-transform: lowercase;
      text-shadow: 0 0 20px rgba(180, 15, 25, 0.8), 0 0 4px #ffffff;
      animation: fatalGlow 3s infinite ease-in-out;
    }

    @keyframes fatalGlow {
      0%, 100% { opacity: 0.9; text-shadow: 0 0 16px rgba(180, 15, 25, 0.8); }
      50% { opacity: 0.45; text-shadow: 0 0 4px rgba(180, 15, 25, 0.4); }
    }
  </style>
</head>
<body id="pageBody">
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="eyes-layer">
    <div class="eye-pair pair-1">
      <div class="peeping-eye"></div>
      <div class="peeping-eye"></div>
    </div>
    <div class="eye-pair pair-2">
      <div class="peeping-eye"></div>
      <div class="peeping-eye"></div>
    </div>
    <div class="eye-pair pair-3">
      <div class="peeping-eye"></div>
      <div class="peeping-eye"></div>
    </div>
    <div class="eye-pair pair-4">
      <div class="peeping-eye"></div>
      <div class="peeping-eye"></div>
    </div>
  </div>

  <div class="content-box" id="mainContent">
    <div class="top-warning">[ classified leak // file: 2+5_v2 ]</div>

    <div class="cover-frame">
      <img src="cover.jpg" alt="2+5 vol. 2 Cover">
      <div class="cover-overlay-tag">VOL. 2</div>
    </div>

    <div class="tracklist-corrupted">
      <div class="tracklist-header">
        <span>TRACKLIST // DELETED</span>
        <span>ERROR 404</span>
      </div>

      <div class="track-row">
        <span>01. <span class="censored-bar t1"></span></span>
        <span class="redacted-tag">[PURGED]</span>
      </div>
      <div class="track-row">
        <span>02. <span class="censored-bar t2"></span></span>
        <span class="redacted-tag">[PURGED]</span>
      </div>
      <div class="track-row">
        <span>03. <span class="censored-bar t3"></span></span>
        <span class="redacted-tag">[CORRUPTED]</span>
      </div>
      <div class="track-row">
        <span>04. <span class="censored-bar t4"></span></span>
        <span class="redacted-tag">[LOST]</span>
      </div>
      <div class="track-row">
        <span>05. <span class="censored-bar t5"></span></span>
        <span class="redacted-tag">[ERASED]</span>
      </div>
    </div>

    <!-- Зазывающая неоновая кнопка «послушать?» -->
    <div class="listen-bait-wrap">
      <button class="listen-btn" id="listenTrigger" type="button">
        <span class="btn-cross">☩</span>
        <span>послушать?</span>
        <span class="btn-cross">☩</span>
      </button>
    </div>

    <div class="footer-promo">
      <h2 class="coming-soon">COMING SOON</h2>
      <p class="hashtags">#TwoPlusFive #TPF</p>
    </div>
  </div>

  <!-- Сцена скримера с летящей пулей и следователем -->
  <div class="screamer-stage">
    <div class="bullet-projectile"></div>
    <div class="rusher-entity">
      <div class="rusher-head">
        <div class="rusher-eyes">
          <div class="r-eye"></div>
          <div class="r-eye"></div>
        </div>
        <div class="rusher-mouth"></div>
      </div>
      <div class="rusher-body"></div>
    </div>
  </div>

  <div class="void-blackout" id="voidScreen">
    <div class="tonett-mark">tonett.</div>
  </div>

  <script>
    function triggerHorrorScreamAndGunshot() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();

        const duration = 1.6;

        // 1. Выстрел пули в упор
        const shotOsc = ctx.createOscillator();
        const shotGain = ctx.createGain();
        shotOsc.type = 'sawtooth';
        shotOsc.frequency.setValueAtTime(380, ctx.currentTime);
        shotOsc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.4);
        shotGain.gain.setValueAtTime(1.0, ctx.currentTime);
        shotGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        shotOsc.connect(shotGain);
        shotGain.connect(ctx.destination);
        shotOsc.start();
        shotOsc.stop(ctx.currentTime + 0.4);

        // 2. Ломание кинескопа (шум)
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(700, ctx.currentTime);
        noiseFilter.frequency.exponentialRampToValueAtTime(4500, ctx.currentTime + 0.9);
        noiseFilter.Q.value = 5;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.85, ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start();

        // 3. Вопль / крик нарастающей частоты
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const sGain = ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(320, ctx.currentTime);
        osc1.frequency.linearRampToValueAtTime(1300, ctx.currentTime + 0.6);
        osc1.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + duration);

        osc2.frequency.setValueAtTime(350, ctx.currentTime);
        osc2.frequency.linearRampToValueAtTime(1420, ctx.currentTime + 0.6);
        osc2.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + duration);

        sGain.gain.setValueAtTime(0.9, ctx.currentTime);
        sGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        osc1.connect(sGain);
        osc2.connect(sGain);
        sGain.connect(ctx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(ctx.currentTime + duration);
        osc2.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    const listenBtn = document.getElementById('listenTrigger');
    const pageBody = document.getElementById('pageBody');
    const voidScreen = document.getElementById('voidScreen');
    const mainContent = document.getElementById('mainContent');

    listenBtn.addEventListener('click', () => {
      triggerHorrorScreamAndGunshot();
      pageBody.classList.add('screamer-active');

      setTimeout(() => {
        mainContent.style.display = 'none';
        voidScreen.classList.add('void-active');
      }, 1350);
    });
  </script>
</body>
</html>
